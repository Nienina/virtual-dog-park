<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Dog Park</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Virtual Dog Park</h1>
    <p class="tagline">A dog encyclopedia and a virtual pet you can adopt, feed and raise.</p>
  </header>

  <main>
    <section id="encyclopedia" class="panel" aria-labelledby="encyclopedia-title">
      <h2 id="encyclopedia-title">Dog encyclopedia</h2>
      <p class="section-note">Three breeds, each with a local illustration and short care notes.</p>
      <div id="breed-list" class="breed-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>AIE1101 Week 5 Lab 2 &middot; built with HTML, CSS and vanilla JavaScript.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
